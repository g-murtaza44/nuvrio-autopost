name: Auto Post

on:
  schedule:
    # Every day at 13:00 UTC = 6:00 PM Pakistan time
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Create today's image
        run: python generate.py

      - name: Upload image so Instagram can fetch it
        run: |
          git config user.name "autopost-bot"
          git config user.email "autopost-bot@users.noreply.github.com"
          git add output
          git commit -m "Add today's post image" || echo "No new image"
          git push
          sleep 15

      - name: Publish
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGE_ACCESS_TOKEN: ${{ secrets.PAGE_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python publish.py

      - name: Save progress
        run: |
          git add state.json
          git commit -m "Move to next post" || echo "No change"
          git push
